plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'house.azeroth.survivors'
    compileSdk 35
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "house.azeroth.survivors"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "0.2.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Do not enable prefab: android-activity 0.6.1 ships its own GameActivity C++ glue.
    packaging {
        jniLibs {
            // page-aligned .so, mmap'd from the APK
            useLegacyPackaging false
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
}
